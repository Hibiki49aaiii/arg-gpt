name: Vertical Slice Validation

on:
  push:
    paths:
      - "works/001-district-eight/**"
      - ".github/workflows/vertical-slice-validate.yml"
  pull_request:
    paths:
      - "works/001-district-eight/**"
      - ".github/workflows/vertical-slice-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate vertical slice
        run: python3 works/001-district-eight/implementation/vertical-slice/validate.py
