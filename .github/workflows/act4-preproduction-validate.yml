name: Act 4 Preproduction Validation

on:
  push:
    paths:
      - "works/001-district-eight/ACT4_*.md"
      - "works/001-district-eight/implementation/act4-staging/**"
      - ".github/workflows/act4-preproduction-validate.yml"
  pull_request:
    paths:
      - "works/001-district-eight/ACT4_*.md"
      - "works/001-district-eight/implementation/act4-staging/**"
      - ".github/workflows/act4-preproduction-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-act4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Act 4 staging contract
        run: python3 works/001-district-eight/implementation/act4-staging/validate_act4.py

      - name: Ensure Act 4 is not linked from Act 0-3 runtimes
        run: |
          if grep -R --include='*.html' --include='*.js' --include='*.css' -nE 'act4-staging|mizuki-diary|水無坂周辺|The Park Without a Clock|partial-map'             works/001-district-eight/implementation/vertical-slice/sites             works/001-district-eight/implementation/act2-staging/site             works/001-district-eight/implementation/act3-staging/site; then
            echo "Act 4 content leaked into an earlier runtime"
            exit 1
          fi
