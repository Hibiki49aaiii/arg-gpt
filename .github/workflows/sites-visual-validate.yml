name: Sites Visual Bundle Validation

on:
  push:
    branches:
      - codex-district-eight-sites
    paths:
      - 'dist/**'
      - '.openai/hosting.json'
      - '.github/workflows/sites-visual-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate static bundle and archival assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          html_path = root / 'dist' / 'index.html'
          hosting_path = root / '.openai' / 'hosting.json'
          assets_dir = root / 'dist' / 'assets'
          vs_dir = assets_dir / 'vs'

          expected_svg = [
              'nagishiro-seal.svg',
              'evacuation-map.svg',
              'archive-index.svg',
              'document-scan.svg',
              'radio-cassette.svg',
              'diary-fragment.svg',
              'reconstruction-map.svg',
          ]
          expected_vs = [
              *[f'area_{n:02d}.png' for n in range(1, 8)],
              'backup-index.txt',
              'h10_summer_disaster_plan.pdf',
              'h10_water_points.pdf',
              'pdf-metadata.html',
              'update-history.html',
          ]

          assert html_path.is_file(), 'dist/index.html missing'
          assert hosting_path.is_file(), '.openai/hosting.json missing'
          assert assets_dir.is_dir(), 'dist/assets missing'
          assert vs_dir.is_dir(), 'dist/assets/vs missing'

          hosting = json.loads(hosting_path.read_text(encoding='utf-8'))
          assert hosting.get('project_id') == 'appgprj_6a9836915bf48191bd2d504f8ac6c46e', 'unexpected Sites project id'
          assert hosting.get('static', {}).get('directory') == 'dist', 'unexpected static directory'

          html = html_path.read_text(encoding='utf-8')
          required_text = [
              'これはフィクション作品です。',
              'district8-sites-bundle-v1',
              '第八避難区',
              '水無坂',
          ]
          for text in required_text:
              assert text in html, f'missing required text: {text}'

          for name in expected_svg:
              path = assets_dir / name
              assert path.is_file(), f'missing asset: {name}'
              ET.parse(path)
              assert f'assets/{name}' in html, f'asset not referenced by index: {name}'

          refs = sorted(set(re.findall(r'assets/([A-Za-z0-9._-]+\.svg)', html)))
          assert refs == sorted(expected_svg), f'unexpected SVG reference set: {refs}'

          for name in expected_vs:
              assert (vs_dir / name).is_file(), f'missing VS asset: {name}'
          assert not (vs_dir / 'area_08.png').exists(), 'area_08.png must remain intentionally absent'

          png_sig = b'\x89PNG\r\n\x1a\n'
          for n in range(1, 8):
              p = vs_dir / f'area_{n:02d}.png'
              assert p.read_bytes()[:8] == png_sig, f'invalid PNG signature: {p.name}'

          for name in ['h10_summer_disaster_plan.pdf', 'h10_water_points.pdf']:
              p = vs_dir / name
              assert p.read_bytes()[:5] == b'%PDF-', f'invalid PDF signature: {name}'

          backup = (vs_dir / 'backup-index.txt').read_text(encoding='utf-8')
          assert 'area_08.png  MISSING' in backup
          assert '/disaster/areas/08/index.html  TARGET MISSING' in backup

          metadata = (vs_dir / 'pdf-metadata.html').read_text(encoding='utf-8')
          assert '平成10年夏季防災計画' in metadata
          assert '給水地点一覧' in metadata
          assert 'これはフィクション作品内の架空資料です。' in metadata

          history = (vs_dir / 'update-history.html').read_text(encoding='utf-8')
          assert '2004-03-18' in history and '1998-07-03' in history

          required_vs_refs = [
              'assets/vs/update-history.html',
              'assets/vs/area_01.png',
              'assets/vs/backup-index.txt',
              'assets/vs/h10_summer_disaster_plan.pdf',
              'assets/vs/h10_water_points.pdf',
              'assets/vs/pdf-metadata.html',
          ]
          for ref in required_vs_refs:
              assert ref in html, f'VS asset not linked from index: {ref}'

          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert len(scripts) == 1, f'expected exactly one inline script, got {len(scripts)}'
          Path('/tmp/district-eight.js').write_text(scripts[0], encoding='utf-8')

          assert html.count('<style>') == 1 and html.count('</style>') == 1, 'style block mismatch'
          assert html.count('<script>') == html.count('</script>') == 1, 'script block mismatch'
          assert html.count('<main') == 1 and html.count('</main>') == 1, 'main landmark mismatch'

          print('Sites project:', hosting['project_id'])
          print('SVG assets:', len(expected_svg))
          print('Vertical Slice media:', len(expected_vs))
          print('Static bundle validation: PASS')
          PY

      - name: Validate JavaScript syntax
        run: node --check /tmp/district-eight.js

      - name: Verify expected Sites package footprint
        shell: bash
        run: |
          count=$((1 + $(find dist -type f | wc -l)))
          echo "Expected Sites package files: $count"
          test "$count" -eq 21

      - name: Install Chromium smoke-test runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser smoke
        shell: bash
        run: |
          python3 -m http.server 8080 --directory dist >/tmp/district-eight-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          const baseState = {
            area: true, found: true, zero: true,
            doc214: true, doc216: true, gap: true,
            person: true, radio: true, diary: true, map: true,
            old: true, now: true, ending: ''
          };

          const profiles = [
            { name: 'desktop', viewport: { width: 1440, height: 1000 } },
            { name: 'mobile', viewport: { width: 390, height: 844 } },
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const profile of profiles) {
              const page = await browser.newPage({ viewport: profile.viewport });
              const errors = [];
              page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));
              page.on('console', msg => {
                if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
              });
              page.on('response', res => {
                if (res.status() >= 400 && !res.url().endsWith('/favicon.ico')) {
                  errors.push(`http ${res.status()}: ${res.url()}`);
                }
              });

              await page.goto('http://127.0.0.1:8080/#home', { waitUntil: 'networkidle' });
              await page.waitForSelector('.card-link');

              const homeAssets = await page.evaluate(() => ({
                mast: getComputedStyle(document.querySelector('.mast'), '::before').backgroundImage,
                cards: Array.from(document.querySelectorAll('.card-link')).map(el => getComputedStyle(el, '::before').backgroundImage),
                disclaimer: document.querySelector('footer')?.textContent || '',
                updateHistory: document.querySelector('a[href="assets/vs/update-history.html"]')?.getAttribute('href') || '',
              }));
              assert.match(homeAssets.mast, /nagishiro-seal\.svg/);
              assert.equal(homeAssets.cards.length, 4);
              assert.match(homeAssets.cards[0], /evacuation-map\.svg/);
              assert.match(homeAssets.cards[1], /archive-index\.svg/);
              assert.match(homeAssets.cards[2], /document-scan\.svg/);
              assert.match(homeAssets.cards[3], /radio-cassette\.svg/);
              assert.match(homeAssets.disclaimer, /フィクション作品/);
              assert.equal(homeAssets.updateHistory, 'assets/vs/update-history.html');

              await page.goto('http://127.0.0.1:8080/#areas', { waitUntil: 'networkidle' });
              await page.waitForSelector('a[href="assets/vs/backup-index.txt"]');
              assert.equal(await page.locator('a[href="assets/vs/area_01.png"]').count(), 1);

              await page.goto('http://127.0.0.1:8080/#archive?q=08', { waitUntil: 'networkidle' });
              await page.waitForSelector('a[href="assets/vs/h10_summer_disaster_plan.pdf"]');
              assert.equal(await page.locator('a[href="assets/vs/h10_water_points.pdf"]').count(), 1);
              assert.equal(await page.locator('a[href="assets/vs/pdf-metadata.html"]').count(), 1);

              for (const path of [
                'assets/vs/area_01.png',
                'assets/vs/backup-index.txt',
                'assets/vs/h10_summer_disaster_plan.pdf',
                'assets/vs/h10_water_points.pdf',
                'assets/vs/pdf-metadata.html',
                'assets/vs/update-history.html',
              ]) {
                const res = await page.request.get(`http://127.0.0.1:8080/${path}`);
                assert.equal(res.status(), 200, `${path} should return 200`);
              }
              const missing08 = await page.request.get('http://127.0.0.1:8080/assets/vs/area_08.png');
              assert.equal(missing08.status(), 404, 'area_08.png must remain missing');

              await page.evaluate(state => {
                localStorage.setItem('district8-sites-bundle-v1', JSON.stringify(state));
              }, baseState);
              await page.reload({ waitUntil: 'networkidle' });

              await page.goto('http://127.0.0.1:8080/#diary', { waitUntil: 'networkidle' });
              await page.waitForSelector('.school .fragments');
              const diaryAsset = await page.evaluate(() => getComputedStyle(document.querySelector('.school .fragments'), '::before').backgroundImage);
              assert.match(diaryAsset, /diary-fragment\.svg/);

              await page.goto('http://127.0.0.1:8080/#map', { waitUntil: 'networkidle' });
              await page.waitForSelector('.research .landmarks');
              const mapAsset = await page.evaluate(() => getComputedStyle(document.querySelector('.research .landmarks'), '::before').backgroundImage);
              assert.match(mapAsset, /reconstruction-map\.svg/);

              await page.screenshot({ path: `qa-${profile.name}.png`, fullPage: true });
              assert.deepEqual(errors, [], `browser errors for ${profile.name}:\n${errors.join('\n')}`);
              await page.close();
              console.log(`${profile.name} browser smoke: PASS`);
            }
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sites-visual-qa
          path: |
            qa-desktop.png
            qa-mobile.png
          if-no-files-found: error
