<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d"><title id="t">水城結の日記断片</title><desc id="d">罫線ノートに書かれた1998年夏の日記断片を模した資料グラフィック。</desc><rect width="640" height="400" fill="#c8c0ad"/><g transform="translate(78 28) rotate(-1.2 240 170)"><rect width="485" height="340" fill="#fbf6e7" stroke="#a79d89" stroke-width="2"/><path d="M55 0v340" stroke="#d3a198" stroke-width="2"/><g stroke="#bfd0cc" stroke-width="1"><path d="M0 58H485M0 92H485M0 126H485M0 160H485M0 194H485M0 228H485M0 262H485M0 296H485"/></g><g font-family="serif" fill="#4b504d"><text x="74" y="48" font-size="16">1998年 8月14日</text><text x="76" y="85" font-size="18">水無坂の家に帰らないと……</text><text x="76" y="119" font-size="18">でも私は今、家にいる。</text><text x="76" y="153" font-size="18">玄関の右下に細い傷。</text><text x="76" y="221" font-size="15" opacity=".62">放送のあとで、誰かが</text><text x="76" y="255" font-size="15" opacity=".62">水無坂と言った。</text></g><path d="M344 184c42-12 71-7 104 10" fill="none" stroke="#777c76" stroke-width="2" opacity=".45"/><path d="M354 195c31 8 56 19 80 36" fill="none" stroke="#777c76" stroke-width="2" opacity=".45"/><circle cx="28" cy="72" r="5" fill="#c1b8a5"/><circle cx="28" cy="168" r="5" fill="#c1b8a5"/><circle cx="28" cy="264" r="5" fill="#c1b8a5"/></g><text x="34" y="385" font-family="monospace" font-size="11" fill="#69645a">PERSONAL RECORD / D-04 / ARCHIVE COPY</text></svg>