<div class="school-shell">

<nav class="school-nav" aria-label="学校史資料室メニュー">

</nav>
<main class="school-main">
<h2>資料検索</h2>
<form class="school-card" data-school-search>
<label for="school-q">氏名・年度・資料名</label>
<div class="search-row"><input id="school-q" name="q" autocomplete="off"><button type="submit">検索</button></div>
</form>
<div data-school-results hidden aria-live="polite"></div>

<h2>公開Collection</h2>
<div class="school-card">
<ul>
<li><a href="/school/junior-high/1997/">平成8年度 中学校卒業資料</a></li>
<li><a href="/school/high-school/1998/enrollment/">平成10年度 高校在籍確認資料</a></li>

<li>部活動大会記録 1994–1999</li>
<li>校舎改築史</li>
<li>PTA広報索引</li>
</ul>
</div>

<p class="muted">この資料室は地域学校史保存会による非公式アーカイブです。個人情報を含む資料は、作品内設定上の公開可能部分のみ掲載しています。</p>
</main>
<footer><a href="/">凪代市史料デジタルアーカイブへ</a></footer>
</div>
