<h1>夏季休業中の連絡対応について（追補）</h1>
<p>市内学校関係者 各位<br>凪代市教育委員会</p>
<p>防災課からの依頼に基づき、該当する生徒・児童への連絡については、通常の緊急連絡網とは別に指定様式を使用してください。</p>
<p><strong>第八避難区対象者</strong>については、保護者への連絡後、対応結果を教育委員会担当へ報告してください。</p>
<p>対象者氏名は別紙によります。</p>
