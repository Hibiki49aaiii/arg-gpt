<h2>EV-031 — 最後の整理メモ</h2>
<div class="document">
<p>残すべきだと思っていた。名前を消すことは、もう一度殺すことだと思っていた。今も、それが間違いだったとは言えない。</p>
<blockquote><strong>残せば戻る。消せば彼らが消える。</strong></blockquote>
<p>名前まで消す必要があるのか、まだ分からない。</p>
<p>場所のことと、人のことを同じように扱っていいのかも分からない。</p>
</div>
<div class="note"><p>このメモは安全な保存方法や現象の完全な説明を残していません。</p><p><strong>残すべき記録と、残してはいけない記録は同じなのか？</strong></p></div>
