<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Playtest Tools｜第八避難区</title>
<link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
<div class="site-shell">
<header class="site-header"><h1>第八避難区 — Playtest Tools</h1><p>作品外・開発用</p></header>
<main>
<h2>セッション状態</h2>
<p>このページはブラウザ内に保存されたVertical Sliceの匿名state/eventsだけを表示します。ネットワーク送信は行いません。</p>
<div class="search-row">
<button type="button" id="refresh">状態を表示</button>
<button type="button" id="copy">JSONをコピー</button>
<button type="button" id="reset">セッション状態をリセット</button>
</div>
<p id="status" aria-live="polite"></p>
<textarea id="output" rows="22" style="width:100%;font-family:ui-monospace,monospace" aria-label="Playtest session JSON"></textarea>
<h2>開始</h2>
<p><a href="/old-bousai/">Vertical Slice Entryへ</a></p>
<p><a href="/meta/">作品外情報へ戻る</a></p>
</main>
</div>
<script>
(function(){
'use strict';
var STATE_KEY='district8-vs-state';
var EVENT_KEY='district8-vs-events';
var output=document.getElementById('output');
var status=document.getElementById('status');
function read(key,fallback){
  try{return JSON.parse(localStorage.getItem(key)||'')||fallback}catch(e){return fallback}
}
function payload(){
  return {state:read(STATE_KEY,{}),events:read(EVENT_KEY,[])};
}
function refresh(){
  output.value=JSON.stringify(payload(),null,2);
  status.textContent='現在のセッション情報を表示しました。';
}
document.getElementById('refresh').addEventListener('click',refresh);
document.getElementById('copy').addEventListener('click',function(){
  refresh();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(output.value).then(function(){status.textContent='JSONをクリップボードへコピーしました。';},function(){status.textContent='コピーできませんでした。テキスト欄から手動でコピーしてください。';});
  }else{
    status.textContent='このブラウザでは自動コピーを利用できません。テキスト欄から手動でコピーしてください。';
  }
});
document.getElementById('reset').addEventListener('click',function(){
  localStorage.removeItem(STATE_KEY);
  localStorage.removeItem(EVENT_KEY);
  output.value='';
  status.textContent='セッション状態をリセットしました。';
});
refresh();
})();
</script>
</body></html>
