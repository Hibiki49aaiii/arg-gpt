<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Playtest Tools｜第八避難区</title>
<link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
<div class="site-shell">
<header class="site-header"><h1>第八避難区 — Playtest Tools</h1><p>作品外・Facilitator用</p></header>
<main>
<h2>セッション</h2>
<p>このページはブラウザ内に保存されたVertical Sliceの匿名state/eventsだけを扱います。ネットワーク送信は行いません。</p>
<div class="search-panel">
<label for="session-id">Session ID</label>
<div class="search-row">
<input id="session-id" autocomplete="off" placeholder="PT-A01" aria-describedby="session-help">
<button type="button" id="save-session-id">Session IDを設定</button>
</div>
<p id="session-help" class="muted">実名・メールアドレス・アカウント名などの個人情報は入力しないでください。</p>
</div>

<h2>セッション状態</h2>
<div class="search-row">
<button type="button" id="refresh">状態を表示</button>
<button type="button" id="copy">JSONをコピー</button>
<button type="button" id="download">JSONをファイル保存</button>
<button type="button" id="reset">セッション状態をリセット</button>
</div>
<p id="status" aria-live="polite"></p>
<textarea id="output" rows="22" style="width:100%;font-family:ui-monospace,monospace" aria-label="Playtest session JSON"></textarea>

<h2>開始</h2>
<p><strong>テスターへ見せるURL:</strong> <a href="/old-bousai/">Vertical Slice Entry</a></p>
<p class="muted">このFacilitatorページ自体はテスターへ見せないでください。</p>
<p><a href="/meta/">作品外情報へ戻る</a></p>
</main>
</div>
<script>
(function(){
'use strict';
var STATE_KEY='district8-vs-state';
var EVENT_KEY='district8-vs-events';
var SESSION_KEY='district8-vs-session-id';
var output=document.getElementById('output');
var status=document.getElementById('status');
var sessionInput=document.getElementById('session-id');

function read(key,fallback){
  try{return JSON.parse(localStorage.getItem(key)||'')||fallback}catch(e){return fallback}
}
function sessionId(){
  try{return localStorage.getItem(SESSION_KEY)||''}catch(e){return ''}
}
function setSessionId(value){
  var clean=(value||'').trim().slice(0,40);
  try{localStorage.setItem(SESSION_KEY,clean)}catch(e){}
  sessionInput.value=clean;
  return clean;
}
function payload(){
  return {
    session_id:sessionId(),
    exported_at:new Date().toISOString(),
    state:read(STATE_KEY,{}),
    events:read(EVENT_KEY,[])
  };
}
function refresh(message){
  output.value=JSON.stringify(payload(),null,2);
  status.textContent=message||'現在のセッション情報を表示しました。';
}
function safeFilename(value){
  var clean=(value||'UNSET').replace(/[^A-Za-z0-9_-]/g,'_').slice(0,40);
  return 'district8-playtest-'+(clean||'UNSET')+'.json';
}

document.getElementById('save-session-id').addEventListener('click',function(){
  var id=setSessionId(sessionInput.value);
  refresh(id?'Session IDを設定しました。':'Session IDは未設定です。');
});
document.getElementById('refresh').addEventListener('click',function(){refresh();});
document.getElementById('copy').addEventListener('click',function(){
  refresh();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(output.value).then(
      function(){status.textContent='JSONをクリップボードへコピーしました。';},
      function(){status.textContent='コピーできませんでした。テキスト欄から手動でコピーしてください。';}
    );
  }else{
    status.textContent='このブラウザでは自動コピーを利用できません。テキスト欄から手動でコピーしてください。';
  }
});
document.getElementById('download').addEventListener('click',function(){
  refresh();
  var blob=new Blob([output.value],{type:'application/json;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download=safeFilename(sessionId());
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  status.textContent='JSONをローカルファイルとして保存しました。外部送信はしていません。';
});
document.getElementById('reset').addEventListener('click',function(){
  localStorage.removeItem(STATE_KEY);
  localStorage.removeItem(EVENT_KEY);
  refresh('セッション状態をリセットしました。Session IDは保持しています。');
});

sessionInput.value=sessionId();
refresh();
})();
</script>
</body></html>
