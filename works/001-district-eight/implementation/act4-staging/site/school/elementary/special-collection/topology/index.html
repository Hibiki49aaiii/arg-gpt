<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>児童資料 位置関係比較</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="school-shell"><header class="school-header"><h1>凪代市学校史資料室</h1><p>児童資料 位置関係比較</p></header>

<main data-topology>
<h2>資料から共通する並びを確認</h2>
<p>3枚の児童画は視点が異なります。各資料の「上り／下り」「近い／遠い」「見える／見えない」を同時に満たすように並べてください。</p>
<div class="topology-row">
<select id="slot1" aria-label="1番目"><option value="">選択</option><option value="PARK">Park</option><option value="VENDING_MACHINE">Vending</option><option value="BLUE_FENCE">Blue Fence</option><option value="TRIANGULAR_ROOF_HALL">Hall</option></select>
<span class="arrow">→</span>
<select id="slot2" aria-label="2番目"><option value="">選択</option><option value="PARK">Park</option><option value="VENDING_MACHINE">Vending</option><option value="BLUE_FENCE">Blue Fence</option><option value="TRIANGULAR_ROOF_HALL">Hall</option></select>
<span class="arrow">→</span>
<select id="slot3" aria-label="3番目"><option value="">選択</option><option value="PARK">Park</option><option value="VENDING_MACHINE">Vending</option><option value="BLUE_FENCE">Blue Fence</option><option value="TRIANGULAR_ROOF_HALL">Hall</option></select>
<span class="arrow">→</span>
<select id="slot4" aria-label="4番目"><option value="">選択</option><option value="PARK">Park</option><option value="VENDING_MACHINE">Vending</option><option value="BLUE_FENCE">Blue Fence</option><option value="TRIANGULAR_ROOF_HALL">Hall</option></select>
</div>
<label for="foundation-location">丸い基礎はどこに含まれるか</label>
<select id="foundation-location"><option value="">選択</option><option value="PARK">Park</option><option value="VENDING_MACHINE">Vending</option><option value="BLUE_FENCE">Blue Fence</option><option value="TRIANGULAR_ROOF_HALL">Hall</option></select>
<p><button type="button" data-check-topology>資料間の整合を確認</button></p>
<p data-topology-status aria-live="polite"></p>
<section data-topology-solved hidden>
<div class="good"><h2>部分関係図を作成</h2><p>この配置なら、3枚の視点と真壁俊の作文が同時に成立します。</p><p><a href="/school/elementary/special-collection/partial-map/">水無坂周辺 — 関係図（暫定）を見る</a></p></div>
</section>
