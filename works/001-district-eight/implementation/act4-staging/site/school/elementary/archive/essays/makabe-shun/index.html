<h2>EV-020 — 真壁 俊 作文</h2>
<div class="provenance"><p><strong>1998-08-18</strong></p><p>児童画A/B/Cおよび水城結とは別の学校・家庭由来。</p></div>
<article class="card"><h3>「夏休みに行きたいところ」</h3>
<p>ぼくは時計のない公園に行きたいです。時計はないけど、まんなかに時計のあとみたいな丸いところがあります。</p>
<p>公園を出ると坂になっていて、途中にジュースの自動販売機があります。</p>
</article>
<p class="muted">作文単独では、青い柵や三角屋根の建物までの位置関係は確認できません。</p>
